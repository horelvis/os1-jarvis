[project]
name = "samantha-widget"
version = "0.1.0"
description = "Samantha as a floating desktop strip (GTK4/X11)"
requires-python = ">=3.12"
# PyGObject is deliberately NOT listed: it comes from the system
# packages python3-gi + gir1.2-gtk-4.0, reached through a venv created
# with --system-site-packages. Listing it here would make pip try to
# build it from source against GObject headers.
dependencies = [
    "websockets>=12,<18",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "sounddevice>=0.4",
    "faster-whisper>=1.1",
    # The second STT engine, and it never produces a word anybody reads:
    # its only job is deciding when you have stopped talking, and whether
    # a sound is his own echo. 39 MB, Apache 2.0, ~5% of one core.
    # CLAUDE.md §2.6 and the design of 2026-09-01 say why it is not
    # Whisper doing this.
    "vosk>=0.3.45",
    # samantha.tts reaches CosyVoice with these two; the samantha package
    # itself is not installable and arrives via PYTHONPATH instead.
    "httpx>=0.27",
    "loguru>=0.7",
    # The phone surface serves HTTPS and a WebSocket from inside the
    # widget's own loop (samantha_widget/remote.py). It arrived in the
    # venv transitively long before that; this is where it becomes a
    # thing we actually depend on.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["samantha_widget*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E402 is off in ruff's default set, and every GTK module here needs it:
# gi.require_version() has to run BEFORE the import it guards, so the
# imports cannot be at the top of the file. Enabling the rule is what
# makes the `# noqa: E402` on those lines honest — with the rule off,
# ruff flags the noqa itself as unused (RUF100) and the file fails lint
# for suppressing a warning it was right to suppress.
select = ["E4", "E7", "E9", "E402", "F", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/test_tts.py imports the TTS client from Hermes/plugins/samantha_voice/,
# which is not an installed package. Add the repo root (one level up from this
# file) to sys.path so that import resolves during collection.
pythonpath = [".."]
