# Hermes settings Samantha needs, and cannot be without.
#
# `.hermes/home/` is git-ignored — it holds auth.json, state.db, the
# session history and the pairing store, none of which belongs in a
# repository. But a handful of settings inside its config.yaml are not
# local state at all: they are part of how Samantha works, and losing
# them breaks her in ways that are hard to see. This file is those
# settings, and `apply-config.sh` merges it in.
#
# Every one of these was learned by something going wrong. Read the
# comments before changing any of them.

# ── Plugins ───────────────────────────────────────────────────────────
# `kind: platform` and `kind: standalone` plugins are opt-in. Without
# jarvis the strip has nothing to talk to; without
# samantha-voice, TTS falls through to Edge — Microsoft's cloud.
plugins:
  enabled:
    - jarvis
    - samantha-voice
    - samantha-vision
    - samantha-code
  entries:
    samantha-voice:
      allow_tool_override: false
    jarvis:
      allow_tool_override: false
    samantha-vision:
      allow_tool_override: false
      # Starting a turn nobody asked for is a per-plugin permission, and
      # it is default-off. Without it `ctx.inject_message()` returns
      # False and logs one line: the cameras go on watching and he never
      # mentions a thing. Measured in Task 1 against
      # `plugins.py::_gateway_injection_allowed`.
      allow_gateway_injection: true
      # The cameras themselves are NOT here, and must not be: this file is
      # tracked in git and pushed, and a camera's address is a fact about
      # somebody's house. They go into `.hermes/home/config.yaml` only,
      # which is not tracked. The shape, with placeholder addresses:
      #
      #   settings:
      #     cameras:
      #       - name: fuera
      #         url: rtsp://admin:${RTSP_PASSWORD}@192.168.x.142:554/h264Preview_01_sub
      #       - name: entrada
      #         url: rtsp://admin:${RTSP_PASSWORD}@192.168.x.143:554/h264Preview_01_sub
      #
      # The PASSWORD is never written into a URL, tracked file or not. It
      # lives in `.env` at the repo root — git-ignored, see `.env.example`
      # — which `Hermes/run-gateway.sh` sources, and the plugin expands
      # `${RTSP_PASSWORD}` when it builds a Camera. A variable that is not
      # set drops that camera with a warning naming it; it is never used
      # as a literal password and the URL is never logged.
      #
      # The `settings:` level is NOT decoration. `ctx.get_config("cameras")`
      # reads `plugins.entries.<id>.settings.cameras` and nothing else
      # (hermes_cli/plugins.py::get_config); put the list straight under
      # the entry and the plugin starts, watches nothing, and says "no
      # cameras configured". Measured 2026-08-24.
      #
      # It stays COMMENTED for a second reason, measured 2026-08-24:
      # apply-config.sh deep-merges dicts but REPLACES lists wholesale, so
      # a live placeholder list here would overwrite the real cameras on
      # the next run and blind him silently. A comment cannot.
      #
      # Which cameras exist, which stream, and how to write the URL:
      # Hermes/plugins/samantha_vision/README.md.
    samantha-code:
      allow_tool_override: false
      # Same permission, and the same failure when it is missing: this is
      # the switch that lets him ASK. Without it the coding assistant's
      # question, the gate before something irreversible and the closing
      # checkpoint all reach `ctx.inject_message()`, get denied, retry
      # three times and end as one line — «el aviso no llegó a la sesión
      # de la tira» — while the run itself carries on perfectly. Measured
      # 2026-08-27 on the first live end-to-end: the work was done and
      # verified, and he never said a word about it.
      allow_gateway_injection: true

# ── TTS ───────────────────────────────────────────────────────────────
# Hermes' default provider is `edge` — Microsoft's cloud. Measured
# 2026-08-23: without this, the agent's own text_to_speech tool
# synthesised there, and the evidence was the cache file's format (MP3
# 48 kbps = Edge; CosyVoice yields WAV/PCM 24 kHz). Samantha's words were
# leaving the house to be spoken.
tts:
  provider: cosyvoice
  streaming:
    provider: cosyvoice

voice:
  # The gateway speaking on its own. The widget does the speaking, from
  # CosyVoice, so this must stay off — and it does NOT stay off by
  # itself: it was found set to true on 2026-08-23 without anyone
  # setting it deliberately.
  auto_tts: false

# No wake word by design (widget decision 4, 2026-08-23): the strip
# listens always and a local VAD decides when someone is talking.
wake_word:
  enabled: false

agent:
  # The widget speaks. With the tts toolset available the agent answers
  # BY VOICE instead: Hermes writes a WAV, the text-only JARVIS adapter
  # cannot deliver it, and the widget receives no reply text at all —
  # so Samantha simply stays silent.
  disabled_toolsets:
    - tts

  # A ceiling on one turn's tool-calling iterations. Absent, Hermes is
  # UNLIMITED by default (`resolve_turn_limit`: "max_turns is unlimited
  # unless the user sets an explicit positive integer cap"), which is
  # what `api_calls=1/9223372036854775807` in the log means.
  #
  # Measured 2026-08-26: a turn looping on a tool this platform does not
  # have ran until somebody noticed — 15,099 tokens in one generation,
  # the GPU at 93% and 391 W, with JARVIS' 90 s watchdog having
  # closed that turn minutes earlier. Nobody was waiting for any of it.
  # The same shape is in the previous day's journal.
  #
  # 25 against the 1-4 an ordinary spoken turn uses, and the 5-9 a turn
  # with several tools uses: generous for anything real, and it bounds a
  # loop at seconds instead of at whenever a human walks past the
  # machine. This is the backstop; `--n-predict 2048` on llama-server
  # caps ONE generation, not a loop of them.
  max_turns: 25

# ── Which tools the strip may use ─────────────────────────────────────
# Per PLATFORM, resolved by gateway/run.py::
# _resolve_enabled_toolsets_for_source. `agent.enabled_toolsets` is NOT a
# config key — it is a Python argument, and writing it here does nothing.
#
# Samantha may act, but never visibly (CLAUDE.md §1, §12). These are the
# toolsets that need no credentials; homeassistant, spotify, discord and
# web search wait on tokens.
#
# `terminal` was deliberately absent until 2026-08-26, on the grounds
# that he lives in a living room and nothing in it can be used without
# narrating what he is doing. The user reversed that, knowingly, for one
# reason: it is what the OFFICIAL integration uses. Hermes ships skills
# for `claude-code`, `opencode` and `codex`, and every one of them is
# written as
#
#   terminal(command="claude -p '…'", workdir="/path", timeout=120)
#
# Without `terminal` those skills are inert — and a plugin of ours that
# tried to replace them hit a wall the same day: the model calls a tool
# of ours with no arguments at all (`args={}`, `user_task="None"`,
# measured six times), which is the failure §4 already records for
# `mirar`. It fills `terminal`'s arguments correctly, because it has
# been trained on it.
#
# The cost, stated rather than discovered: he can now run ANY command on
# this machine, not only the assistant. What bounds it is `max_turns`,
# `--n-predict`, and the fact that everything he does is on one box that
# belongs to the person talking to him.
#
# Still absent: file, code_execution, browser.
#
# `camaras` carries `mirar` — he looks at a camera now and says what is
# there. The name is ours and that is the whole point (Ruling 11): the
# plugin spec §6.2 said `vision`, and Hermes' own `vision` toolset
# (`toolsets.py:134`) already carries `vision_analyze`. Listing `vision`
# here to reach `mirar` also offered him an image-analysis tool this box
# cannot serve — Qwen3.8-27B does not look at images, and
# `check_vision_requirements()` returns True anyway because it resolves
# the local provider (measured 2026-08-25). Offering a tool that cannot
# work is what `check_fn` exists to prevent; a toolset of our own keeps
# that promise at the toolset level too.
# ── He is told what time it is ────────────────────────────────────────
#
# Hermes' own system prompt says, verbatim: "Current time, date,
# timezone → use terminal (e.g. date)". This platform deliberately does
# NOT have `terminal` (see the toolsets below), so that instruction sends
# him to a tool that is not there — measured 2026-08-26, the error
# `'terminal' is not a deferrable tool` and a run that burned 15,099
# tokens against it. Having failed, he invents the time: asked for a
# reminder "in six minutes" at 14:23 he filed it for 17:34, because he
# believed it was 17:28. Three hours out, and a reminder that never
# arrives.
#
# With this on, every user message reaches him prefixed
# `[Wed 2026-08-26 14:34:47 CEST]`, so the clock is a fact in front of
# him rather than something to go and fetch. Default is OFF because it
# changes what every gateway user sees; here it is the difference
# between reminders working and not.
gateway:
  message_timestamps:
    enabled: true

# ── The tools are offered directly, not through a search bridge ───────
#
# Hermes hides tool schemas behind three bridge tools — `tool_search`,
# `tool_describe`, `tool_call` — and on "auto" that bridge activates as
# soon as ONE deferrable tool exists (`tool_search.should_activate`).
# Every plugin tool is deferrable, so `mirar` alone kept it on
# permanently, and the strip's whole toolset was reachable only by
# searching for it first.
#
# Measured 2026-08-26: asked to note something down, he answered "el
# café ya lo tengo apuntado" having called nothing at all — the memory
# file was untouched. And a run burned 15,099 tokens against
# `tool_call(terminal)`, a tool this platform does not even have,
# answered by `'terminal' is not a deferrable tool`.
#
# The bridge is for agents with hundreds of tools. This platform has six
# toolsets, whose schemas fit the 64K context many times over, and one
# indirection fewer is one fewer thing for a 27B model to get wrong.
tools:
  tool_search: false

# `web` was in the "waits on tokens" list above until 2026-08-26, and it
# turned out not to: Hermes ships keyless search providers, and
# `check_web_api_key()` returns True with nothing configured —
# `web_search_tool("tiempo en Murcia mañana")` came back with real
# results on the first try. The user asked for this twice ("sigue sin
# acceso a herramientas ni internet"), and the alternative under
# discussion — the `browser` toolset — needs the `agent-browser` CLI
# installed through npm, which §12 (2026-05-13) moved this project away
# from.
#
# The privacy line moves, and §1.1 already carries the shape of it: the
# conversation stays on this box, but the TEXT OF A SEARCH leaves it.
# Nothing else does — no history, no identity, no audio.
# ── The coding assistant, as a peer rather than a plugin ──────────────
#
# `Hermes/bridges/code-a2a/` serves an A2A agent card on :9910 and runs
# the assistant in whichever project the request names, under ~/git.
# Nothing is written on this side: `a2a_call` and friends ship with
# Hermes, and the bridge is just an agent they can call. The user chose
# it that way on 2026-08-26 "por el futuro uso de opencode" — another
# assistant is another server, and this file does not change.
#
# The timeout is what a coding task actually takes. The default (120 s)
# ends the call while the assistant is still reading the repository.
a2a_agents:
  codigo:
    url: "http://127.0.0.1:9910"
    timeout: 900
    capabilities: [code, development, tests]

# plugins.entries.samantha-code.settings.bridge:
#   The code bridge's URL (default http://127.0.0.1:9910). Empty string
#   selects the legacy tee-file follower (a box without the bridge).

platform_toolsets:
  jarvis:
    - memory
    - session_search
    - cronjob
    - todo
    - clarify
    - camaras
    - web
    - a2a
    - codigo
    - terminal

# ── Model ─────────────────────────────────────────────────────────────
# The gateway resolves its own per request and works without this. Cron
# jobs do not: a job fires, finds model.default empty, and dies with
# "has no model configured". The reminder never arrives and nothing says
# why. Pin cron jobs themselves too (`--provider`/`--model`), or a later
# change to this value makes Hermes skip them to avoid unintended spend.
model:
  default: qwen3.8-27b
  provider: custom:local
  # Hermes refuses any model whose window is under 64,000 and kills the
  # turn outright, so llama-server must be started with --ctx-size 65536
  # to match.
  context_length: 65536

providers:
  local:
    base_url: http://127.0.0.1:8000/v1
    api_key: no-key-required
    default_model: qwen3.8-27b
    extra_body:
      chat_template_kwargs:
        # Qwen3.8 reasons by default and puts EVERYTHING into
        # reasoning_content: `content` comes back EMPTY and the strip
        # sits in "thinking" without ever speaking.
        enable_thinking: false

# Note on the two fields above: provider and model are SEPARATE. Putting
# `custom:local` into model.default sends the literal string
# "custom:local" to xAI as a model name and the turn dies with a 404 —
# resolution only reads `model.provider`.
#
# To go back to the cloud: `default: grok-4.6`, drop `provider`, and
# unset `context_length`.
