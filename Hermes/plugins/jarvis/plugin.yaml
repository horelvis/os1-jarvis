manifest_version: 2
api_version: 1
name: jarvis
label: JARVIS
kind: platform
version: 1.0.0
description: >
  Holds the single WebSocket the strip talks over. Text only in this
  version; audio arrives in plan 3b.
author: Horelvis Castillo

# ─────────────────────────────────────────────────────────────────────────
# How this plugin fails, and how it fails SILENTLY.
#
# The house failure mode of this whole project is a turn that reaches
# nothing and says nothing. The convention (same as samantha-voice's
# manifest) is that the manifest names those ways, because the manifest is
# the first file an operator opens.
#
# 1. AUTHORIZATION. Hermes default-denies a platform it has no allowlist
#    for; a denied JARVIS turn is a log warning and nothing on the screen.
#    register() declares JARVIS_ALLOWED_USERS (falling back to the old
#    SAMANTHA_KIOSK_ALLOWED_USERS) and defaults it to
#    "primary" — the user id frontend/src/net/wsClient.ts:80 sends. Change
#    one without the other and every turn is dropped. With NO allowlist at
#    all the default is worse than silence: Hermes greets the owner in
#    English with a pairing code, on their own screen.
#
# 2. A TURN THAT NEVER COMES BACK. The gateway answers asynchronously, so
#    nothing downstream guarantees a reply. The adapter arms a watchdog per
#    accepted `chat` frame (JARVIS_TURN_TIMEOUT, falling back to the old
#    SAMANTHA_KIOSK_TURN_TIMEOUT, default 90 s) and
#    pushes an `error` frame if nothing closed the turn. Without it the
#    strip hangs forever — `busy` never clears, and because the STT
#    commit is gated on `busy`, VOICE input dies with it.
#
# 3. NOBODY LISTENING. If the strip is mid-reconnect, send() reports
#    success=False/retryable=True so Hermes retries rather than losing the
#    reply. If the strip died without a FIN the socket looks alive in
#    Python; heartbeat=30 turns that into a normal close instead of a sink
#    that swallows every reply with no log line.
#
# 4. THE VOICE IS NOT HERS YET. Replies come from Hermes' own SOUL.md
#    persona, not backend/samantha/personality.py. Known, out of scope for
#    plan 3a; see docs/running-real-mode.md.
# ─────────────────────────────────────────────────────────────────────────

# Declaration only — Hermes never installs these. See docs/running-real-mode.md.
python_dependencies:
  - "aiohttp>=3.9,<4"   # upper bound per Hermes dependency policy (plugins doctor warns without it)

optional_env:
  - name: JARVIS_PORT
    description: "Puerto donde se sirve el WebSocket de JARVIS (por defecto 7777)"
    prompt: "Puerto de JARVIS"
    password: false
  - name: JARVIS_ALLOWED_USERS
    description: >
      Quién puede hablar con JARVIS (por defecto "primary", que es el
      user_id que envía la interfaz)
    prompt: "user_id autorizado"
    password: false
  - name: JARVIS_ALLOW_ALL_USERS
    description: >
      Deja pasar a cualquiera para hablar con JARVIS. No hace falta en un
      aparato de una sola persona; existe para depurar
    prompt: "¿Permitir a cualquiera? (true/false)"
    password: false
  - name: JARVIS_TURN_TIMEOUT
    description: >
      Segundos que espera antes de decir que algo se ha quedado a medias
      (por defecto 90)
    prompt: "Segundos de espera por respuesta"
    password: false
