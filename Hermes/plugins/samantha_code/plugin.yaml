manifest_version: 2
api_version: 1
name: samantha-code
label: Samantha (code)
kind: standalone
version: 0.1.0
description: >
  The coding assistant, watched live. Hermes can already CALL it —
  `a2a_call` reaches the bridge and returns the answer — but that waits
  for the end. This opens the bridge's stream instead, pushes every line
  into the strip's terminal as it is written, and hands the model only
  the sentence worth saying.
author: Horelvis Castillo

# ─────────────────────────────────────────────────────────────────────
# How this plugin fails, and how it fails SILENTLY.
#
# 1. THE BRIDGE IS NOT RUNNING. `samantha-code-a2a.service` serves
#    :9910; without it the stream never opens and the tool answers that
#    the assistant said nothing. Indistinguishable, from the user's
#    side, from an assistant that had nothing to say — which is why the
#    failure is logged with the exception and not only reported.
#
# 2. THE STRIP IS NOT CONNECTED. Every line is pushed and dropped. The
#    work still happens and the sentence still gets spoken; what is lost
#    is watching it. Silent on purpose: a warning per line would drown
#    the journal in the first minute of a real task.
#
# 3. THE TURN'S LOOP, NOT THE GATEWAY'S. Lines are scheduled onto the
#    loop the adapter's websocket lives on, because the loop a turn
#    brings with it stops running when the turn ends — the bug that cost
#    the live camera a day (§12, 2026-08-26). If `adapter.loop` ever
#    stops being set, this goes quiet with nothing in the log.
#
# 4. A TASK LONGER THAN THE CEILING. The stream is read on a worker
#    thread with a 30-minute timeout. Past it the reader gives up while
#    the assistant keeps working: the repository still changes, and
#    nobody is told what happened.

python_dependencies:
  - "loguru>=0.7,<1"
