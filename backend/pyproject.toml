[project]
name = "samantha-backend"
version = "0.1.0"
description = "Samantha backend — FastAPI server (mock for development, real models in production)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",  # uploads de audio
    "loguru>=0.7",                # logging legible
    "httpx>=0.27",                # cliente OpenAI-compat para llama-server (real mode)
    "chromadb>=0.5.0",            # memoria semántica persistente (Phase 6)
    "fastembed>=0.5",             # multilingual ONNX embedder for memory recall (Phase 1)
    "pipecat-ai[silero]>=0.0.89,<0.1.0",  # Phase 11 — voice pipeline framework + Silero VAD
    "faster-whisper>=1.0.3",      # Phase 11 — STT
    "numpy>=2.0",                 # Phase 11 — audio resampling
]

[project.optional-dependencies]
real = [
    "sounddevice>=0.4.7",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # cliente HTTP para tests
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["samantha*"]

[tool.ruff]
line-length = 100
target-version = "py311"
