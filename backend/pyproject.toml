[project]
name = "samantha-backend"
version = "0.1.0"
description = "Samantha backend — FastAPI server (mock for development, real models in production)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",  # uploads de audio
    "loguru>=0.7",                # logging legible
    "httpx>=0.27",                # cliente OpenAI-compat para llama-server (real mode)
    "chromadb>=0.5.0",            # memoria semántica persistente (Phase 6)
]

[project.optional-dependencies]
# Dependencias que SOLO se necesitan cuando integremos modelos reales.
# Durante desarrollo con el mock, no las instalamos.
#
# Nota: llama.cpp corre como binario separado (llama-server), no como
# dependencia de Python. Aquí sólo viven las cosas Python-side de fases
# posteriores (STT, TTS).
real = [
    "faster-whisper>=1.0.3",       # Phase 5 — STT
    "piper-tts>=1.2.0",            # Phase 5 — TTS
    "sentence-transformers>=3.0",  # better Spanish embeddings (swap-in for memoria)
    "silero-vad>=5.1",             # Phase 5 — VAD
    "sounddevice>=0.4.7",          # Phase 5 — captura de audio
    "numpy>=2.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # cliente HTTP para tests
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["samantha*"]

[tool.ruff]
line-length = 100
target-version = "py311"
