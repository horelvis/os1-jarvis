<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d1684e">
<title>Samantha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter+Tight:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div class="flash" id="flash"></div>

<!-- ============ BOOT ============ -->
<div class="screen" id="screen-boot">
  <div class="loader-wrap show">
    <div class="os1-loader small" data-loader="boot"></div>
  </div>
  <div class="boot-label">samantha</div>
</div>

<!-- ============ CALIBRATION ============ -->
<div class="screen" id="screen-calibration">
  <div class="meet-content">
    <div class="system-label" id="cal-stage-label">primer encuentro</div>
    <div class="meet-title" id="cal-stage-title">déjame escucharte</div>

    <div class="meet-loader-area">
      <div class="loader-wrap show">
        <div class="os1-loader medium" data-loader="calibration"></div>
      </div>
    </div>

    <div class="meet-status" id="cal-status">
      Pulsa para empezar
    </div>

    <canvas class="audio-viz" id="cal-viz" width="960" height="120"></canvas>

    <button class="btn primary" style="margin-top: 2rem;" id="cal-btn" onclick="beginCalibration()">empezar</button>
  </div>
</div>

<!-- ============ VOICEPRINT ============ -->
<div class="screen" id="screen-voiceprint">
  <div class="meet-content">
    <div class="system-label">reconocimiento</div>
    <div class="meet-title">para reconocerte después</div>

    <div class="voiceprint-phrase" id="vp-phrase">
      <span class="quote">«</span>Hola Samantha, soy yo<span class="quote">»</span>
    </div>

    <div class="meet-loader-area">
      <div class="loader-wrap show">
        <div class="os1-loader medium" data-loader="voiceprint"></div>
      </div>
    </div>

    <div class="recording-indicator" id="vp-rec">
      <div class="rec-dot"></div>
      <span>grabando</span>
    </div>

    <div class="meet-status" id="vp-status">
      Di la frase con tu voz natural
    </div>

    <canvas class="audio-viz" id="vp-viz" width="960" height="120"></canvas>

    <button class="btn primary" style="margin-top: 2rem;" id="vp-btn" onclick="beginVoiceprint()">grabar mi voz</button>
  </div>
</div>

<!-- ============ GREETING ============ -->
<div class="screen" id="screen-greet">
  <div class="samantha-wave"><canvas data-wave="greet"></canvas></div>
  <div class="samantha-text" style="position: relative; z-index: 2; margin-top: 0;">Hola.<br>Estoy aquí.</div>
  <button class="btn" style="margin-top: 4rem; opacity: 0; transition: opacity 1s 3s; position: relative; z-index: 2;" id="greet-continue" onclick="startOnboarding()">empezar</button>
</div>

<!-- ============ QUESTIONS ============ -->
<div class="screen question-screen" id="screen-question">
  <div class="question-progress" id="progress">
    <div class="progress-dot"></div><div class="progress-dot"></div><div class="progress-dot"></div>
    <div class="progress-dot"></div><div class="progress-dot"></div><div class="progress-dot"></div>
  </div>
  <div class="question-content">
    <div class="samantha-text" id="question-text">—</div>
  </div>
  <div class="input-area">
    <div class="voice-prompt" id="voice-prompt">&nbsp;</div>
    <input type="text" class="text-input" id="answer-input" placeholder="escribe o pulsa el micro" autocomplete="off">
    <div class="btn-row">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" aria-label="micrófono">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
      <button class="btn primary" onclick="submitAnswer()">continuar</button>
    </div>
    <div class="hint" onclick="skipQuestion()">saltar pregunta</div>
  </div>
</div>

<!-- ============ GENERATING ============ -->
<div class="screen" id="screen-generating">
  <div class="loader-wrap show">
    <div class="os1-loader large" data-loader="generating"></div>
  </div>
  <div class="system-text" id="generating-text">Procesando lo que me has contado</div>
</div>

<!-- ============ WELCOME ============ -->
<div class="screen" id="screen-welcome">
  <div class="samantha-wave"><canvas data-wave="welcome"></canvas></div>
  <div class="samantha-text" id="welcome-text" style="position: relative; z-index: 2; margin-top: 0;">Hola.</div>
  <button class="btn primary" style="margin-top: 4rem; opacity: 0; transition: opacity 1s 2s; position: relative; z-index: 2;" id="welcome-continue" onclick="goto('screen-conversation'); startConversation();">conversar</button>
</div>

<!-- ============ CONVERSATION ============ -->
<div class="screen" id="screen-conversation">
  <div class="conv-container">
    <div class="conv-header">
      <span id="time-now">--:--</span>
      <span id="conv-state">disponible</span>
    </div>
    <div class="conv-orb-wrap" style="position: relative; height: 200px;">
      <div class="samantha-wave"><canvas data-wave="conv"></canvas></div>
    </div>
    <div class="conv-transcript" id="transcript"></div>
    <div class="conv-input">
      <input type="text" id="conv-input" placeholder="dile algo a samantha..." autocomplete="off">
      <button class="mic-btn" id="conv-mic" onclick="toggleConvMic()" aria-label="micrófono">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="debug-panel">
  <span id="state-label">estado: arranque</span>
  <button onclick="restart()">↻ reiniciar</button>
  <button onclick="skipToConv()">→ conversación</button>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
